[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parquad"
version = "0.1.0"
description = "Parquet-backed RDF Triple Store — high-performance SPARQL storage via Apache Parquet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Peb Aryan" },
]
keywords = ["rdf", "sparql", "parquet", "triple-store", "semantic-web", "rdflib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "rdflib>=6.4.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1",
]

[project.urls]
Repository = "https://github.com/pebaryan/parquad"

[tool.hatch.build.targets.wheel]
packages = ["src/parquad"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N803"]  # camelCase args match rdflib API

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long lines in tests are fine
"src/parquad/store.py" = ["E501"]  # long SPARQL query strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"